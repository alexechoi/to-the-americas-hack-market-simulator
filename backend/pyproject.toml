[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.125.0",
    "firebase-admin>=6.6.0",
    "logfire[fastapi]>=4.32.1",
    "lxml>=6.1.0",
    "pydantic-ai>=1.16",
    "python-dotenv>=1.0.0",
    "ruff>=0.14.10",
    "sse-starlette>=3.3.4",
    "uvicorn>=0.38.0",
    "yfinance>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
